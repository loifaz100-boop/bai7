name: Java CI with Automated Review

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ] # Trigger khi có PR hướng vào main

jobs:
  build:
    runs-on: ubuntu-latest

    # BẮT BUỘC: Cấp quyền viết để Bot có thể đăng bình luận (comment) vào Pull Request
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Bước 1: Chạy lệnh build, test và checkstyle của Maven.
      # Chắc chắn bước này sẽ văng lỗi (FAIL) vì ta đang cố tình viết sai ở file MathService.java
      - name: Run Checkstyle and Fail Build
        run: mvn clean verify

      # Bước 2: Tích hợp Bot đăng comment phản hồi
      - name: Checkstyle Inline Feedback
        if: always() # RẤT QUAN TRỌNG: Đảm bảo dù bước trên bị FAIL, Bot vẫn chạy để thả comment
        uses: dbelyaev/action-checkstyle@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: google_checks.xml
          level: error
          reporter: github-pr-review # Cấu hình để bot review trực tiếp trên từng dòng code của PR